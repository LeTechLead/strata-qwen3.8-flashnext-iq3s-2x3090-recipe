# Compose file for the Strata IQ3_S service. Copy alongside a build of the Dockerfile.
# Paths below are examples — adjust -v left-hand sides to your layout.
services:
  strata-flashnext-iq3s:
    image: strata:0.1.40.1
    container_name: strata-flashnext-iq3s
    gpus: all
    ports:
      - "8080:8080"          # OpenAI /v1 + Anthropic /v1/messages on one port
    volumes:
      - ./models/qwen38-flashnext-gsq-iq3s:/models:ro
      - ./data/packs:/packs
      - ./data/mtp:/mtp
      - ./config/iq3s.json:/config/iq3s.json:ro
    command: >
      python3 /app/strata/serve/server.py --engine strata
      --config /config/iq3s.json --host 0.0.0.0 --port 8080
    # IMPORTANT: no egress. Without network access the engine can never self-update
    # from GitHub releases; it starts the build you compiled. (Offline: "network_mode: none"
    # on podman, or run on an isolated compose network with no internet route.)
    shm_size: "16gb"
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 45
      start_period: 300s     # IQ3_S @ 262k takes minutes to load + warm; a short window
                             # marks a loading container unhealthy and restart:always kills it
